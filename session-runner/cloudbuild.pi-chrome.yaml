substitutions:
  _IMAGE: us-central1-docker.pkg.dev/pi-agents-cloud/pi-agents/session-runner:pi-chrome
  _RESOLUTION_KEY: local

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.pi-chrome
      - -t
      - ${_IMAGE}
      - --build-arg
      - MAPACHE_BUILD_RESOLUTION_KEY=${_RESOLUTION_KEY}
      - .

images:
  - ${_IMAGE}
