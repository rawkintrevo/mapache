name: Runner Registry Cleanup

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Preview or apply retention policies
        type: choice
        options: [plan, dry-run, apply]
        default: plan
  pull_request:
    paths:
      - scripts/runner-registry-cleanup*
      - .github/workflows/runner-registry-cleanup.yml

permissions:
  contents: read

concurrency:
  group: runner-registry-cleanup
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test scripts/runner-registry-cleanup.test.mjs

  refresh:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PI_AGENTS_CLOUD }}
          project_id: pi-agents-cloud
      - uses: google-github-actions/setup-gcloud@v3
      - name: Refresh policies from live deployment inventory
        env:
          CLEANUP_MODE: ${{ github.event_name == 'schedule' && 'apply' || inputs.mode }}
        run: node scripts/runner-registry-cleanup.mjs --project=pi-agents-cloud --mode="$CLEANUP_MODE" > cleanup-plan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner-registry-cleanup-plan
          path: cleanup-plan.json
          retention-days: 14
